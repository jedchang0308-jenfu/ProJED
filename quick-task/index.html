<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ProJED快速建待辦" />
    <link rel="icon" type="image/png" href="/icons/icon-vibrant-03-mango-berry.png" />
    <link rel="manifest" href="/quick-task/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-vibrant-02-aqua-lime.png" />
    <title>ProJED快速建待辦</title>
  </head>
  <body>
    <main class="quick-task-shell" data-quick-task-root="true">
      <header class="quick-task-header">
        <span class="quick-task-mark" aria-hidden="true">＋</span>
        <div>
          <p class="quick-task-eyebrow">ProJED</p>
          <h1>快速建待辦</h1>
        </div>
      </header>
      <section id="quick-task-install" class="quick-task-install" data-quick-install="true" hidden aria-live="polite"></section>
      <form id="quick-task-form" novalidate onsubmit="return false">
        <label class="quick-task-label" for="quick-task-title">任務名稱</label>
        <div class="quick-task-input-row">
          <input id="quick-task-title" type="text" inputmode="text" enterkeyhint="done" autocomplete="off" placeholder="要記下什麼？" maxlength="500" />
          <button id="quick-task-voice" class="quick-task-voice" type="button" disabled aria-label="使用語音輸入任務名稱" title="使用語音輸入任務名稱">
            <span aria-hidden="true">🎙</span><span>語音</span>
          </button>
        </div>
        <button id="quick-task-submit" class="quick-task-submit" type="submit" disabled>建立</button>
      </form>
      <p id="quick-task-message" class="quick-task-message" role="status" aria-live="polite">正在準備快速輸入…</p>
      <section id="quick-task-success" class="quick-task-success" hidden aria-live="polite"></section>
      <section id="quick-task-recovery" class="quick-task-recovery" hidden></section>
      <noscript>需要啟用 JavaScript 才能建立待辦；目前可先選取並複製名稱。</noscript>
    </main>
    <script type="module" src="/src/quickTask/main.ts"></script>
  </body>
</html>
